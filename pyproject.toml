[project]
name = "beerstream1"
version = "0.1.0"
description = "An event-loop-native MySQL client for asyncio, built for throughput."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RealistikDash" }]
requires-python = ">=3.14"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3.14"]

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "beerstream1._native"
features = ["pyo3/extension-module"]
