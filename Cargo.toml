[package]
name = "beerstream1"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["RealistikDash"]
description = "An event-loop-native MySQL client for asyncio, built for throughput."
publish = false

[lib]
name = "beerstream1"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30" }
libc = "0.2"
sha1 = "0.10"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha1"] }
memchr = "2"
socket2 = "0.6"
itoa = "1"
ryu = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = false
